# =============================================================================
# Senjougahara — config.example.yaml
# Copy this file to config/config.yaml and fill in your values.
# Secrets (API keys) go in .env — NOT here.
# =============================================================================

# ─── Personality ──────────────────────────────────────────────────────────────
personality:
  active_profile: senjougahara   # matches a file in brain/personality/profiles/

# ─── LLM Provider ─────────────────────────────────────────────────────────────
llm:
  provider: ollama               # ollama | anthropic | openai | gemini
  # Recommended local models:
  # - qwen3:8b (default): richer roleplay, excellent Japanese/bilingual nuance, native tool calling (~5.5GB VRAM, ~10s turn)
  # - qwen2.5:7b: fastest alternative (~4.7GB VRAM, ~5-6s turn), solid tool calling for low-latency setups
  model: qwen3:8b                # model identifier (e.g. qwen3:8b, qwen2.5:7b, llama3.1:8b)
  # For Ollama only:
  # ollama_base_url is read from OLLAMA_BASE_URL in .env (default: http://localhost:11434)



# ─── Speech / STT ─────────────────────────────────────────────────────────────
stt:
  enabled: true
  engine: faster-whisper
  model_size: small              # tiny | base | small | medium | large-v3
  device: auto                   # auto | cuda | cpu
  compute_type: auto             # auto | int8 | float16 | int8_float16
  language: pt                 # "pt" (default) | "en" | "ja" | null (auto-detect)

# ─── Wake Word ────────────────────────────────────────────────────────────────
wake_word:
  enabled: false                 # Phase 2+: enable when custom model is ready
  phrase: hey_jarvis             # built-in openWakeWord model for Phase 1 testing
  # custom_model_path: null      # path to a trained .onnx custom wake-word model

# ─── Hotkey ───────────────────────────────────────────────────────────────────
hotkey:
  enabled: true
  key: right ctrl                # Right Ctrl default; NumPad+ is a common alt
  # Valid values: any key name accepted by the `keyboard` library

# ─── TTS ──────────────────────────────────────────────────────────────────────
tts:
  engine_base_url: "${TTS_ENGINE_BASE_URL}"   # resolved from .env
  speaker_id: "${TTS_SPEAKER_ID}"             # resolved from .env
  speed: 1.0
  pitch: 0.0

# ─── Avatar Bridge ────────────────────────────────────────────────────────────
bridge:
  host: 127.0.0.1
  port: 8765
  # The bridge server lives in avatar/src/main/bridge-server.ts
  # The brain connects to it as a WebSocket client.

# ─── Memory (Phase 5+) ────────────────────────────────────────────────────────
memory:
  enabled: false                 # Enable in Phase 5
  # db_path is always %LOCALAPPDATA%\Senjougahara\memory.db
  summary_threshold_turns: 20    # Summarize conversation after N turns

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  # Override individual tool risk tiers here.
  # CAUTION: HIGH tier tools can NEVER be downgraded to silent auto-approve.
  # See docs/PERMISSIONS.md for the full list of overrideable and fixed actions.
  overrides: {}
  # Example:
  # overrides:
  #   terminal.run: MEDIUM   # relax from HIGH for specific trusted commands

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: INFO                    # DEBUG | INFO | WARNING | ERROR
  # Log files go to %APPDATA%\Senjougahara\logs\

# ─── Session / Greeting ───────────────────────────────────────────────────────
session:
  greeting_cooldown_hours: 8     # Minimum hours between greeting triggers
  # session_state.json is written to %LOCALAPPDATA%\Senjougahara\

# ─── Remote Approval (Telegram) ───────────────────────────────────────────────
telegram:
  enabled: false                 # Set true to receive HIGH-tier approval prompts in Telegram
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"

# ─── Proactivity (Spontaneous Observations) ──────────────────────────────────
proactivity:
  enabled: false                 # Opt-in: enable low-frequency, context-aware comments
  poll_interval_seconds: 30.0    # Window awareness observation interval
  min_cooldown_minutes: 12.0     # Minimum quiet time between spontaneous comments
  min_window_stable_seconds: 20.0 # Time the foreground window must remain focused
  repeat_window_minutes: 60.0    # Avoid commenting on the same window within this window
  blocked_processes:             # Apps where comments are suppressed (calls, meetings, etc.)
    - Teams.exe
    - zoom.exe
    - Discord.exe


