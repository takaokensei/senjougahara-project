<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Mascot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag; /* ウィンドウドラッグ移動を有効化 */
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      -webkit-app-region: no-drag; /* OrbitControls 操作を有効化 */
    }

    #error-overlay {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 24, 32, 0.92);
      color: #ffffff;
      border: 1px solid rgba(255, 107, 107, 0.6);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      max-width: 90%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      -webkit-app-region: no-drag;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 999;
    }

    #error-overlay strong {
      color: #ff6b6b;
      display: block;
      margin-bottom: 4px;
    }

    #error-overlay code {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
  </style>
  <!-- Import Maps for Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.5/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.4.5/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="error-overlay">
    <strong>⚠️ VRM Model Not Found</strong>
    <span id="error-msg">Place a <code>.vrm</code> file (e.g. <code>AliciaSolid.vrm</code>) into <code>avatar/assets/models/</code></span>
  </div>
  <script type="module" src="./VRM.js"></script>
</body>
</html>
